name: Deploy to takesavillage.la

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The server's host keys are pinned in .github/known_hosts
      - name: Upload via SFTP
        env:
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
        run: |
          sudo apt-get install -y sshpass > /dev/null 2>&1
          sshpass -e sftp -o UserKnownHostsFile=.github/known_hosts -o StrictHostKeyChecking=yes \
            ${{ secrets.SFTP_USER }}@takesavillage.la <<'SFTP'
          put site.css /home/takesavillage/takesavillage.la/site.css
          put constellations-flier.jpg /home/takesavillage/takesavillage.la/constellations-flier.jpg
          put index.html /home/takesavillage/takesavillage.la/index.html
          put missing.html /home/takesavillage/takesavillage.la/missing.html
          put logo.png /home/takesavillage/takesavillage.la/logo.png
          put favicon.svg /home/takesavillage/takesavillage.la/favicon.svg
          -mkdir /home/takesavillage/takesavillage.la/gallery
          put "gallery/gallery (1).jpg" "/home/takesavillage/takesavillage.la/gallery/gallery (1).jpg"
          put "gallery/gallery (2).jpg" "/home/takesavillage/takesavillage.la/gallery/gallery (2).jpg"
          put "gallery/gallery (3).jpg" "/home/takesavillage/takesavillage.la/gallery/gallery (3).jpg"
          put "gallery/gallery (6).jpg" "/home/takesavillage/takesavillage.la/gallery/gallery (6).jpg"
          put "gallery/gallery (7).jpg" "/home/takesavillage/takesavillage.la/gallery/gallery (7).jpg"
          put "gallery/gallery (8).jpg" "/home/takesavillage/takesavillage.la/gallery/gallery (8).jpg"
          -mkdir /home/takesavillage/takesavillage.la/archive
          put archive/lacma.jpg /home/takesavillage/takesavillage.la/archive/lacma.jpg
          put archive/special-camp.jpg /home/takesavillage/takesavillage.la/archive/special-camp.jpg
          put archive/csun.jpg /home/takesavillage/takesavillage.la/archive/csun.jpg
          put archive/note-to-self.jpg /home/takesavillage/takesavillage.la/archive/note-to-self.jpg
          put archive/full-moon.jpg /home/takesavillage/takesavillage.la/archive/full-moon.jpg
          put archive/unmasked.jpg /home/takesavillage/takesavillage.la/archive/unmasked.jpg
          SFTP

      - name: Confirm
        run: echo "✅ Deployed to takesavillage.la"
